name: Label in-game feedback

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Tag issues sent from the game's Feedback form
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const title = issue.title || "";
            if (!/^Version: /m.test(body) && !/^\[(Bug|Idea|Balance|Art \/ UI|Other)\]/.test(title)) return;
            const labels = ["feedback"];
            const m = title.match(/^\[(Bug|Idea|Balance|Art \/ UI|Other)\]/);
            if (m) labels.push({"Bug": "bug", "Idea": "idea", "Balance": "balance", "Art / UI": "art-ui", "Other": "other"}[m[1]]);
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels });
